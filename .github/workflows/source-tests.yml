name: Source tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-tk python3-apt
      - name: Python tests (synthetic only)
        run: /usr/bin/python3 -m unittest discover -s tests -v
      - name: Frontend tests
        run: node tests/test_fleet.js && node tests/test_fleet_ui.js
      - name: Source audit
        run: python3 builder/audit-source.py
      - name: Reachable history audit
        run: python3 builder/audit-source.py --mode history
