source /boot/grub/config.cfg
set default=0
set timeout=5
menuentry 'Install Code Swarm OS (Debian 13)' {
 linux /install/vmlinuz auto=true priority=high preseed/file=/cdrom/code-swarm.cfg vga=788 --- quiet
 initrd /install/initrd.gz
}
menuentry 'Recovery - rescue an existing installation' {
 linux /install/vmlinuz rescue/enable=true vga=788 --- quiet
 initrd /install/initrd.gz
}
menuentry 'Abort - power off' {
 halt
}
