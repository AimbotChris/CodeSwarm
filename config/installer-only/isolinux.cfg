DEFAULT vesamenu.c32
PROMPT 0
TIMEOUT 50
MENU TITLE Code Swarm OS - install or recover
LABEL install
 MENU LABEL Install Code Swarm OS (Debian 13)
 MENU DEFAULT
 LINUX /install/vmlinuz
 INITRD /install/initrd.gz
 APPEND auto=true priority=high preseed/file=/cdrom/code-swarm.cfg vga=788 --- quiet
LABEL rescue
 MENU LABEL Recovery - rescue an existing installation
 LINUX /install/vmlinuz
 INITRD /install/initrd.gz
 APPEND rescue/enable=true vga=788 --- quiet
LABEL abort
 MENU LABEL Abort - boot local disk
 LOCALBOOT 0
